<g class="direct-label"><rect x="275" y="536" width="214" height="31" rx="5"/>
    <text x="382.0" y="558">Đọc/ghi · Web SDK</text></g>
<g class="direct-label"><rect x="596" y="562" width="194" height="31" rx="5"/>
    <text x="693.0" y="584">Tệp · Storage SDK</text></g>
<g class="edge-label"><rect x="587" y="514" width="237" height="31" rx="5"/>
