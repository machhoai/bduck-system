    <text x="1036.0" y="558">Tệp · Admin SDK</text></g>
<line x1="75" y1="900" x2="125" y2="900" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="140" y="906" class="legend">Lời gọi trực tiếp</text>
<line x1="390" y1="900" x2="440" y2="900" stroke="#1692a8" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="455" y="906" class="legend">Web truy cập dữ liệu trực tiếp</text>
<rect x="830" y="885" width="22" height="22" fill="#e2efff" stroke="#2563eb" stroke-width="2"/>
<text x="865" y="904" class="legend">Ứng dụng</text>
