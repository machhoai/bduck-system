name: Production CI and Images (WMS)

on:
  push:
    branches:
      - main
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/bduck-system

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint employee contract rollout
        run: pnpm run lint:employee-contracts

      - name: Typecheck
        run: pnpm --filter @bduck/shared-types build && pnpm run typecheck

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_PREFIX }}-be-wms
            ${{ env.IMAGE_PREFIX }}-fe-wms
          tags: |
            type=sha,format=long
            type=raw,value=latest-prod

      - name: Build and push backend (be-wms)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/be-wms/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-be-wms:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-be-wms:latest-prod
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-be-wms:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-be-wms:buildcache,mode=max

      - name: Build and push frontend (fe-wms)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/fe-wms/Dockerfile
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_LEAVE_FEATURE_ENABLED=${{ vars.NEXT_PUBLIC_LEAVE_FEATURE_ENABLED || 'false' }}
            NEXT_PUBLIC_EMPLOYEE_CONTRACTS_FEATURE_ENABLED=${{ vars.NEXT_PUBLIC_EMPLOYEE_CONTRACTS_FEATURE_ENABLED || 'true' }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-fe-wms:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-fe-wms:latest-prod
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-fe-wms:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-fe-wms:buildcache,mode=max
